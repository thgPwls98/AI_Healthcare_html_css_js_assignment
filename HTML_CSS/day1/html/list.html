<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- list: 여러개의 데이터를 출력 -->
    <!-- ul : Unordered List -> 순서가 없는 리스트 (순서신경 안쓰는) -->
    자신있는 프로그래밍 언어
    <ul>
        <!-- li : List item -->
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>
    <hr>
    <!-- Ordered List -->
    <!-- 순서가 있는 리스트이므로 얘는 숫자가 붙음 -->
    <!-- 태그의 속성(Attribute) 지정
    type : 형식지정
        - a : a, b, c로 순서 지정
        - A : 대문자 알파벳으로 순서지정
        - i : 로마자로 순서지정
    start : 시작값을 지정하는 속성 -->
    <ol type="a" start="-1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>    
    
</body>
</html>

<!DOCTYPE html>     
<!-- 작성할 것이 html임을 선언 -->
<html>
    <!-- 헤드 : 화면에 대한 부가정보. 직접적인 데이터는 아님. body를 설명하는 데이터(메타데이터) -->
    <head>
        <title>My Page</title>
    </head>
    <!-- 바디 : 본문. 웹 페이지의 실제 화면-->
    <body>
        <!-- h1: 헤딩. 제목(텍스트 강조) -->
        <h1>Hello, HTML</h1>
        <h2>할말이 없네</h2>
        <h3>이거 뭐라고 적으셨더라. h태그는 6까지 있어</h3>
        <p>안녕하세요? </p>
        
    </body>




</html>

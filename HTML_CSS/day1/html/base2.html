<!-- '!'를 누르고 엔터치면 기본세팅 자동완성해줌 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport: 화면크기  -->
    <!-- content="width=device-width, initial-scale=1.0"> : 기기 크기에 자동맞춤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- 기본적으로 html은 태그를 기준으로 모든걸 수행하기 때문에 태그 안에서 줄바꿈 아무리 해도 줄바꿈 적용 안됨 -->
<!-- p 태그로 하면 자동으로 태그별로 인식해서 줄바꿈 가능
br 태그를 쓰면 줄바꿈 해줌. 
    - \n이랑 동일하게 씀. 
    - 하지만 일반적으로 줄바꿈 공백을 이걸로 하지는 않음. 
    - 닫는 태그 없이 단일로 쓰는 태그
hr : horisontal line 이다. 
    - 가로선을 그어주는 태그이다. 
    - 세로선 그어주는 태그는 없다.  -->
<body>
    <!-- br (brake) : 브레이크를 걸어서 줄바꿈하겠다는 소리임 -->
    hello, world! <br>
    <hr>
    hello, world! <br>
    <hr>
    hello, world! <br>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- img : 이미지태그. 닫는 태그 없이 단일로 쓰는 독립 태그임
    src : 소스코드. (source : 근원, 원천, 출처 라는 뜻) -->
    <img src="https://plus.unsplash.com/premium_photo-1789652752045-7db8caff8c0c?q=80&w=200&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" 
    alt="">
    <hr>
    <!-- alt : alternative text, 사진이 깨지면 alt를 출력해달라 -->
    <img src="" alt="건축 사진">
    <hr>
    <!-- 로컬에서 불러오는 경우는 쿼리 파라미터 못씀. 응답할 서버가 없잖아. -->
    <img width="200" src="./다운로드 (10).png" alt="당뇨병 데이터 히트맵">
</body>
</html>

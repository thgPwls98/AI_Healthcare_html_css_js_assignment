<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 테이블(표) -->
    <!-- border : 경계선을 나타내는 속성. 굵기를 숫자로 지정 가능. 옛날에 쓰던 방식이라 지금은 거의 안씀  -->
    <table border="1">
        <!-- 테이블 헤드 -->
        <thead>
            <!-- tr : table row -->
            <tr>
                <!-- th (table head): tr에 들어가는 하나하나의 요소 -->
                <th>ID</th>
                <th>이름</th>
                <th>이메일</th>
            </tr>
        </thead>
        <!-- 테이블 바디 -->
        <tbody>
            <tr>
                <!-- td : table data cell -->
                <td>1</td>
                <td>alex</td>
                <td>alex@example.com</td>
            </tr>
            <tr>
                <!-- td : table data cell -->
                <td>2</td>
                <td>bob</td>
                <td>bob@example.com</td>
            </tr>
            <tr>
                <!-- td : table data cell -->
                <td>3</td>
                <td>chris</td>
                <td>chris@example.com</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
